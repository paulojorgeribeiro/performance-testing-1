name: Main Schedule Workflow v2

on:
  # schedule:
  #   - cron: '0,30 * * * *'  # DESATIVADO: corria de 30/30 min
  workflow_dispatch:  # Só manual

env:
  TIME_WINDOW_MINUTES: 15  # Variável global do workflow

jobs:
  scheduled-performance-test:
    runs-on: [self-hosted, linux, podman, perf]  # filtra o teu runner
    timeout-minutes: 60

    steps:
      - name: Sanity check (runtime)
        run: |
          podman --version || true
          docker --version || true
          docker info || podman info

      - name: Running test
        run: |
          echo "Checking for scheduled tests in the last ${{ env.TIME_WINDOW_MINUTES }} minutes"
          "${HOME}/run-test-scheduled.sh" \
            "${{ secrets.GITHUB_TOKEN }}" \
            "${{ github.repository }}" \
            "${{ vars.PERFORMANCE_HOME }}" \
            "${{ vars.SCHEDULE_FILE_NAME }}" \
            "${{ env.TIME_WINDOW_MINUTES }}" \
            "${{ github.ref_name }}"

          if [ $? -ne 0 ]; then
            echo "Schedule validation failed"
            exit 1
          fi


