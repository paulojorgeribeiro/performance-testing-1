name: Local Runner Example

on:
  workflow_dispatch:

jobs:
  ssh-job:
    runs-on: ubuntu-latest   # ← usa runner do GitHub (não precisa de instalar nada na VM)
    steps:
      - name: Definir variáveis do teste
        run: |
          echo "LAC_ID=LAC.0001" >> $GITHUB_ENV
          echo "TEST_ID=TEST.0001" >> $GITHUB_ENV
          echo "TEST_DEFINITION_FILE=default.jmx" >> $GITHUB_ENV
          echo "TEST_DATA_FILE=test-data-001.csv" >> $GITHUB_ENV
          echo "CONTAINER_NAME=jmeter-performance-testing" >> $GITHUB_ENV
          echo "REPO=paulojorgeribeiro/performance-testing-1" >> $GITHUB_ENV
          echo "STREAM=DIGITAL" >> $GITHUB_ENV
          echo "TEST_TYPE=load-test" >> $GITHUB_ENV
          echo "ENVIRONMENT=PP" >> $GITHUB_ENV
          echo "JMETER_PARAMS=-Jjmeter.save.saveservice.output_format=xml -Jjmeter.save.saveservice.timestamp_format=yyyy-MM-dd'T'HH:mm:ss.SSSZ" >> $GITHUB_ENV

      - name: Executar teste remotamente via SSH
        run: |
          echo "Running performance test ${{ env.TEST_ID }} on LAC ${{ env.LAC_ID }}"
          ssh -o StrictHostKeyChecking=no "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" '\
            /home/ubuntu/run-test.sh \
              "${{ secrets.TOKEN }}" \
              "${{ env.REPO }}" \
              "${{ env.TEST_DEFINITION_FILE }}" \
              "${{ env.TEST_DATA_FILE }}" \
              "${{ env.LAC_ID }}" \
              "${{ env.TEST_ID }}" \
              "${{ env.CONTAINER_NAME }}" \
              "${{ vars.PERFORMANCE_HOME }}" \
              "${{ env.JMETER_PARAMS }}" \
              "${{ env.STREAM }}" \
              "${{ env.TEST_TYPE }}" \
              "${{ env.ENVIRONMENT }}" \
              "${{ github.actor }}" \
              "${{ secrets.SSH_USER }}" \
              "${{ secrets.SSH_HOST }}" \
          '

      - name: Buscar artefactos da VM
        run: |
          scp -o StrictHostKeyChecking=no \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ vars.PERFORMANCE_HOME }}/${{ env.LAC_ID }}/${{ env.TEST_ID }}/results.jtl" .
          scp -o StrictHostKeyChecking=no \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ vars.PERFORMANCE_HOME }}/${{ env.LAC_ID }}/${{ env.TEST_ID }}/jmeter.log" .
          # report.zip (se existir)
          ssh -o StrictHostKeyChecking=no "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" 'test -f "${{ vars.PERFORMANCE_HOME }}/${{ env.LAC_ID }}/${{ env.TEST_ID }}/report.zip"'
          if [ $? -eq 0 ]; then
            scp -o StrictHostKeyChecking=no \
              "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ vars.PERFORMANCE_HOME }}/${{ env.LAC_ID }}/${{ env.TEST_ID }}/report.zip" .
          fi

      - name: Upload de resultados
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-results-and-logs
          path: |
            results.jtl
            jmeter.log
            report.zip
          if-no-files-found: warn

      - name: Cleanup remoto
        if: always()
        run: |
          ssh -o StrictHostKeyChecking=no "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" '\
            rm -rf "${{ vars.PERFORMANCE_HOME }}/${{ env.LAC_ID }}/${{ env.TEST_ID }}" \
          '
