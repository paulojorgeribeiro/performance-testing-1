name: Performance Test
description: Run performance tests on the specified LAC and TEST ID.

on:
  workflow_dispatch:
    inputs:
      LAC_ID:
        description: "The LAC identifier"
        required: true
        default: "LAC.0001"
      TEST_ID:
        description: "The Test identifier"
        required: true
        default: "TEST.0001"

jobs:
  performance-test:
    runs-on: [self-hosted, linux, podman, perf]
    timeout-minutes: 600

    steps:
      # (-1) Fix overlay: usar driver 'vfs' dentro do runner em contentor
      - name: Force Podman to use vfs (container runner fix)
        run: |
          echo "CONTAINERS_STORAGE_DRIVER=vfs" >> "$GITHUB_ENV"

      # 0) "docker" → Podman remoto (API do host na 8666)
      - name: Make docker shim for Podman (remote API)
        run: |
          # Tenta o nome canónico; se falhar, usa o IP especial 10.0.2.2
          echo 'PODMAN_HOST=tcp://host.containers.internal:8666' >> "$GITHUB_ENV"
          mkdir -p "$HOME/bin"
          cat > "$HOME/bin/docker" <<'SH'
          #!/usr/bin/env sh
          # fallback automático se o DNS interno não existir
          if podman --remote --url "$PODMAN_HOST" info >/dev/null 2>&1; then
            exec podman --remote --url "$PODMAN_HOST" "$@"
          else
            exec podman --remote --url tcp://10.0.2.2:8666 "$@"
          fi
          SH
          chmod +x "$HOME/bin/docker"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      # 1) Clonar o repositório para $GITHUB_WORKSPACE
      - name: Checkout
        uses: actions/checkout@v4

      # 2) Sanity – confirmar acesso ao Podman REMOTO e paths
      - name: Sanity check (remote podman & paths)
        run: |
          podman --remote --url "$PODMAN_HOST" info
          docker --version || true
          echo "GITHUB_WORKSPACE=${GITHUB_WORKSPACE}"
          ls -la "${GITHUB_WORKSPACE}/shell" || true

      # 3) Permissões de execução
      - name: Make scripts executable
        working-directory: ${{ github.workspace }}
        run: |
          chmod +x shell/run-test.sh || true
          chmod +x shell/run-test-performance-jmeter.sh || true
          chmod +x shell/cleanup-remote-job.sh || true

      # 4) Executar o teste: usar o REPO como PERFORMANCE_HOME
      - name: Running test
        env:
          PERFORMANCE_HOME: ${{ github.workspace }}
          AUTHENTICATION: ${{ env.AUTHENTICATION }}   # remove se não usas
        working-directory: ${{ github.workspace }}
        run: |
          echo "Running performance test ${{ inputs.TEST_ID }} on LAC ${{ inputs.LAC_ID }}"
          bash shell/run-test.sh \
            "${{ secrets.GITHUB_TOKEN }}" \
            "${{ github.repository }}" \
            "${{ inputs.LAC_ID }}" \
            "${{ inputs.TEST_ID }}" \
            "${PERFORMANCE_HOME}" \
            "${{ github.actor }}" \
            "${{ github.ref_name }}" \
            "${{ secrets.VAULT_TOKEN }}" \
            "${AUTHENTICATION}"

      # 5) Limpeza
      - name: Cleanup remote job
        if: always()
        env:
          PERFORMANCE_HOME: ${{ github.workspace }}
        working-directory: ${{ github.workspace }}
        run: |
          bash shell/cleanup-remote-job.sh "${{ inputs.LAC_ID }}" "${{ inputs.TEST_ID }}" "${{ secrets.VAULT_TOKEN }}"

