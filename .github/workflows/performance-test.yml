name: Performance Test
description: Run performance tests from a config file and publish results.

on:
  workflow_dispatch:
    inputs:
      ENVIRONMENT:
        description: "Execution mode (dev|prod)"
        required: true
        default: "dev"
      CONFIG_PATH:
        description: "Caminho do YAML do teste (ex.: configs/TEST.0001.yml)"
        required: true
        default: "configs/TEST.0001.yml"

jobs:
  performance-test:
    runs-on: self-hosted #[self-hosted, linux, podman, perf]
    timeout-minutes: 600
    env:
      MODE: ${{ inputs.ENVIRONMENT }}   # dev|prod
      AUTHENTICATION: none              # em prod pode mudar para "app"

    steps:
      # (-1) Fix overlay: usar driver 'vfs' dentro do runner em contentor
      - name: Force Podman to use vfs (container runner fix)
        run: |
          echo "CONTAINERS_STORAGE_DRIVER=vfs" >> "$GITHUB_ENV"

      # 0) "docker" → Podman remoto (API do host via 8666, com fallback slirp4netns)
      - name: Make docker shim for Podman (remote API)
        run: |
          echo 'PODMAN_HOST=tcp://host.containers.internal:8666' >> "$GITHUB_ENV"
          mkdir -p "$HOME/bin"
          cat > "$HOME/bin/docker" <<'SH'
          #!/usr/bin/env sh
          if podman --remote --url "$PODMAN_HOST" info >/dev/null 2>&1; then
            exec podman --remote --url "$PODMAN_HOST" "$@"
          else
            exec podman --remote --url tcp://10.0.2.2:8666 "$@"
          fi
          SH
          chmod +x "$HOME/bin/docker"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      # 1) Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 1.1) Set environment mode (DEV/PROD)
      - name: Set environment mode (DEV/PROD)
        run: |
          echo "[INFO] Selected mode: ${MODE}"
          if [[ "${MODE}" == "dev" ]]; then
            echo "VAULT_ADDR=http://host.containers.internal:18200" >> "$GITHUB_ENV"
            echo "VAULT_TOKEN=root" >> "$GITHUB_ENV"
            echo "AUTHENTICATION=none" >> "$GITHUB_ENV"
            echo "SKIP_REGISTRY=1" >> "$GITHUB_ENV"
            echo "DPT_REGISTRY_URL=" >> "$GITHUB_ENV"
            echo "API_VERSION=" >> "$GITHUB_ENV"
          else
            # ⚠️ Em PROD: defina estes secrets/vars no GitHub
            echo "VAULT_ADDR=${{ secrets.VAULT_PROD_ADDR }}" >> "$GITHUB_ENV"
            echo "VAULT_TOKEN=${{ secrets.VAULT_PROD_TOKEN }}" >> "$GITHUB_ENV"
            echo "AUTHENTICATION=app" >> "$GITHUB_ENV"
            echo "SKIP_REGISTRY=0" >> "$GITHUB_ENV"
            echo "DPT_REGISTRY_URL=${{ secrets.DPT_REGISTRY_URL }}" >> "$GITHUB_ENV"
            echo "API_VERSION=${{ vars.DPT_API_VERSION }}" >> "$GITHUB_ENV"
          fi

      # 1.2) Instalar yq (parser de YAML)
      - name: Install yq (YAML parser)
        run: |
          curl -sSL https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64 -o /usr/local/bin/yq
          chmod +x /usr/local/bin/yq
          yq --version

      # 1.3) Carregar a config YAML e exportar variáveis
      - name: Load test config
        run: |
          set -euo pipefail
          test -f "${{ inputs.CONFIG_PATH }}" || { echo "Config não encontrada: ${{ inputs.CONFIG_PATH }}"; exit 1; }
          echo "LAC_ID=$(yq -r '.lac_id' '${{ inputs.CONFIG_PATH }}')" >> "$GITHUB_ENV"
          echo "TEST_ID=$(yq -r '.test_id' '${{ inputs.CONFIG_PATH }}')" >> "$GITHUB_ENV"
          echo "BASE_URL=$(yq -r '.target.base_url' '${{ inputs.CONFIG_PATH }}')" >> "$GITHUB_ENV"
          echo "DURATION_S=$(yq -r '.load.duration_s' '${{ inputs.CONFIG_PATH }}')" >> "$GITHUB_ENV"
          echo "RPS=$(yq -r '.load.rps' '${{ inputs.CONFIG_PATH }}')" >> "$GITHUB_ENV"
          echo "CONCURRENCY=$(yq -r '.load.concurrency' '${{ inputs.CONFIG_PATH }}')" >> "$GITHUB_ENV"
          echo "LABEL_ENV=$(yq -r '.labels.environment' '${{ inputs.CONFIG_PATH }}')" >> "$GITHUB_ENV"
          echo "LABEL_SYS=$(yq -r '.labels.system' '${{ inputs.CONFIG_PATH }}')" >> "$GITHUB_ENV"
          echo "LABEL_NOTES=$(yq -r '.labels.notes' '${{ inputs.CONFIG_PATH }}')" >> "$GITHUB_ENV"
          echo "[cfg] Carregado ${LAC_ID}/${TEST_ID} @ ${BASE_URL}"

      # 2) Sanity – confirmar Podman remoto e paths
      - name: Sanity check (remote podman & paths)
        run: |
          podman --remote --url "$PODMAN_HOST" info || true
          docker --version || true
          echo "GITHUB_WORKSPACE=${GITHUB_WORKSPACE}"
          ls -la "${GITHUB_WORKSPACE}/shell" || true
          echo "MODE=${MODE}"

      # 2.5) (DEV) Seed Vault automático para ptp_api_key (idempotente)
      - name: Seed Vault DEV (idempotent)
        if: ${{ env.MODE == 'dev' }}
        run: |
          set -euo pipefail
          VAULT_ENDPOINT="${VAULT_ADDR:-${VAULT_URL:-http://host.containers.internal:18200}}"
          echo "[seed] Endpoint: $VAULT_ENDPOINT"
          curl -sS -H "X-Vault-Token: ${VAULT_TOKEN}" -H "Content-Type: application/json" \
               -X POST "$VAULT_ENDPOINT/v1/sys/mounts/devplatforms" \
               -d '{"type":"kv","options":{"version":"2"}}' >/dev/null 2>&1 || true
          curl -sS -H "X-Vault-Token: ${VAULT_TOKEN}" -H "Content-Type: application/json" \
               -X POST "$VAULT_ENDPOINT/v1/devplatforms/data/performance-platform/application" \
               -d '{"data":{"ptp_api_key":"dummy-ptp-key-123"}}' >/dev/null
          echo "[seed] OK"

      # 2.6) Hotfix: patch ao run-test.sh (preferir VAULT_ADDR; fallback VAULT_URL)
      - name: Patch run-test.sh (prefer VAULT_ADDR; fallback VAULT_URL)
        working-directory: ${{ github.workspace }}
        run: |
          mv shell/run-test.sh shell/run-test.orig.sh
          cat > shell/run-test.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail

          echo "[INFO] Starting test run..."
          echo "[INFO] Defining runtime variables..."

          GITHUB_TOKEN="${1}"; REPO="${2}"; LAC_ID="${3}"; TEST_ID="${4}"; TEST_HOME="${5}";
          USER_NAME="${6}"; GITHUB_REF_NAME="${7}"; VAULT_TOKEN="${8}";
          AUTHENTICATION="${9:-none}"; SCRIPT_VERSION="${10:-}"

          SHELL_DIR="${TEST_HOME}/shell"
          LIB_PATH="${SHELL_DIR}/run-test-lib.sh"
          if [[ ! -f "${LIB_PATH}" ]]; then echo "[ERROR] Failed to load libs"; exit 1; fi
          # shellcheck disable=SC1090
          source "${LIB_PATH}"

          VAULT_ENDPOINT="${VAULT_ADDR:-${VAULT_URL:-}}"
          if [[ -z "${VAULT_ENDPOINT}" ]]; then
            echo "[ERROR] VAULT_ADDR/VAULT_URL não definido."
            exit 1
          fi
          echo "[INFO] Using Vault endpoint: ${VAULT_ENDPOINT}"

          echo "[INFO] Fetching PTP_API_KEY from Vault..."
          PTP_API_KEY=$(curl -sS \
            --header "X-Vault-Token: ${VAULT_TOKEN}" \
            --request GET "${VAULT_ENDPOINT}/v1/devplatforms/data/performance-platform/application" \
            | jq -r '.data.data.ptp_api_key // empty')
          if [[ -z "${PTP_API_KEY}" ]]; then echo "[ERROR] Failed to retrieve API_KEY from Vault."; exit 1; fi
          export PTP_API_KEY

          if [[ "${AUTHENTICATION}" != "none" ]]; then
            echo "[INFO] Authentication mode: ${AUTHENTICATION}"
          else
            echo "[INFO] Skipping GitHub App authentication in DEV (AUTHENTICATION=none)."
          fi

          curl -sS --request POST -H "X-Vault-Token: ${VAULT_TOKEN}" \
            "${VAULT_ENDPOINT}/v1/auth/token/renew-self" >/dev/null || true
          echo "[INFO] Vault token renew attempted."

          echo "[INFO] Fetching test-definition.json..."
          curl -sS -H "Authorization: token ${GITHUB_TOKEN}" \
               -H "Accept: application/vnd.github.v3.raw" \
               -o test-definition.json \
               "https://api.github.com/repos/${REPO}/contents/${TEST_HOME}/${LAC_ID}/${TEST_ID}/test-definition.json?ref=${GITHUB_REF_NAME}"
          if [[ ! -s test-definition.json ]] ; then echo "[ERROR] test-definition.json not found"; exit 1; fi

          for TYPE in $(jq -r '.test | keys[]' test-definition.json); do
            case "${TYPE}" in
              performance)
                bash "${SHELL_DIR}/cleanup-remote-job.sh" "${LAC_ID}" "${TEST_ID}" "${VAULT_TOKEN}" || true
                bash "${SHELL_DIR}/run-test-performance.sh" \
                  "${GITHUB_TOKEN}" "${REPO}" "${LAC_ID}" "${TEST_ID}" "${TEST_HOME}" \
                  "${USER_NAME}" "${GITHUB_REF_NAME}" "${VAULT_TOKEN}" "" "${PTP_API_KEY}" \
                  "${AUTHENTICATION}" "${SCRIPT_VERSION}" || handle_error "[ERROR] Test run failed!"
                ;;
              resilience)
                bash "${SHELL_DIR}/run-test-resilience.sh" \
                  "${GITHUB_TOKEN}" "${REPO}" "${LAC_ID}" "${TEST_ID}" "${TEST_HOME}" \
                  "${USER_NAME}" "${GITHUB_REF_NAME}" "${VAULT_TOKEN}" "" "${PTP_API_KEY}" \
                  || handle_error "[ERROR] Test run failed!"
                ;;
              *)
                echo "[ERROR] Unsupported test type: ${TYPE}"; exit 1;;
            esac
          done

          echo "[INFO] Test run completed."
          SH
          chmod +x shell/run-test.sh

      # 3) Permissões de execução
      - name: Make scripts executable
        working-directory: ${{ github.workspace }}
        run: |
          chmod +x shell/run-test.sh || true
          chmod +x shell/run-test-performance-jmeter.sh || true
          chmod +x shell/cleanup-remote-job.sh || true

      # 3.5) Diagnóstico — Health do Vault
      - name: Diag — Health do Vault
        run: |
          set -euo pipefail
          VAULT_ENDPOINT="${VAULT_ADDR:-${VAULT_URL:-}}"
          echo "[diag] VAULT_ENDPOINT=$VAULT_ENDPOINT"
          echo "[diag] Testar saúde do Vault..."
          curl -sS "$VAULT_ENDPOINT/v1/sys/health" || (echo "[diag] Falha a aceder ao Vault" && exit 1)

      # 4) Running test (usa LAC_ID/TEST_ID da config YAML)
      - name: Running test
        env:
          PERFORMANCE_HOME: ${{ github.workspace }}
          AUTHENTICATION: ${{ env.AUTHENTICATION }}
        working-directory: ${{ github.workspace }}
        run: |
          echo "Running performance test ${TEST_ID} on LAC ${LAC_ID}"
          # disponibilizar config aos scripts
          export BASE_URL DURATION_S RPS CONCURRENCY LABEL_ENV LABEL_SYS LABEL_NOTES
          bash shell/run-test.sh \
            "${{ secrets.GITHUB_TOKEN }}" \
            "${{ github.repository }}" \
            "${LAC_ID}" \
            "${TEST_ID}" \
            "${PERFORMANCE_HOME}" \
            "${{ github.actor }}" \
            "${{ github.ref_name }}" \
            "${VAULT_TOKEN}" \
            "${AUTHENTICATION}"

      # 4.1) Gerar summary.json (usa CSV em results/raw se existir; senão usa envs)
      - name: Build results summary
        run: |
          # Caso o teu script já calcule métricas, exporta-as aqui (opcional):
          # export THROUGHPUT_RPS=150
          # export P95_MS=420
          # export AVG_MS=210
          # export ERROR_PCT=0.5
          # export DURATION_S=300
          # export REQUESTS_TOTAL=45000
          bash shell/report-summary.sh "${LAC_ID}" "${TEST_ID}" "results"
          test -s results/summary.json

    # 4.2) Publicar artefactos (summary + brutos)
      - name: Upload results artifacts
        uses: actions/upload-artifact@v4
        with:
          name: perf-results-${{ env.LAC_ID }}-${{ env.TEST_ID }}-${{ github.run_id }}
          path: |
            results/summary.json
            results/raw/**
          if-no-files-found: warn

    # 4.3) Sumário imediato no GitHub Actions (Markdown)
      - name: Write run summary
        run: |
          # jq é usado noutros passos; se faltar, instala: sudo apt-get update && sudo apt-get install -y jq
          THR=$(jq -r '.metrics.throughput_rps' results/summary.json)
          P95=$(jq -r '.metrics.p95_latency_ms' results/summary.json)
          ERR=$(jq -r '.metrics.error_rate_pct' results/summary.json)
          DUR=$(jq -r '.metrics.duration_s' results/summary.json)
          REQ=$(jq -r '.metrics.requests_total' results/summary.json)
          echo "## Resultados — ${LAC_ID} / ${TEST_ID}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Métrica | Valor |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---:|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Throughput (RPS) | $THR |" >> "$GITHUB_STEP_SUMMARY"
          echo "| P95 Latência (ms) | $P95 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Taxa de Erro (%) | $ERR |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Duração (s) | $DUR |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Pedidos totais | $REQ |" >> "$GITHUB_STEP_SUMMARY"


      # 5) Cleanup (corre sempre; tolerante em DEV)
      - name: Cleanup remote job
        if: always()
        env:
          PERFORMANCE_HOME: ${{ github.workspace }}
        working-directory: ${{ github.workspace }}
        run: |
          bash shell/cleanup-remote-job.sh "${LAC_ID}" "${TEST_ID}" "${VAULT_TOKEN}"


