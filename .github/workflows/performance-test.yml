name: Performance Test

on:
  workflow_dispatch:
    inputs:
      ENVIRONMENT:
        description: "Execution mode (dev|prod)"
        required: true
        default: "dev"
      CONFIG_PATH:
        description: "Caminho do YAML do teste (ex.: configs/TEST.0001.yml)"
        required: true
        default: "configs/TEST.0001.yml"

jobs:
  performance-test:
    name: Performance Testing Pipeline
    runs-on: self-hosted
    timeout-minutes: 600

    defaults:
      run:
        shell: bash

    permissions:
      contents: read

    env:
      MODE: ${{ inputs.ENVIRONMENT }}   # dev|prod
      AUTHENTICATION: none              # em prod pode mudar para "app"

    steps:
      - name: Force Podman to use vfs (container runner fix)
        run: |
          echo "CONTAINERS_STORAGE_DRIVER=vfs" >> "$GITHUB_ENV"

      - name: Make docker shim for Podman (remote API)
        run: |
          echo 'PODMAN_HOST=tcp://host.containers.internal:8666' >> "$GITHUB_ENV"
          mkdir -p "$HOME/bin"
          cat > "$HOME/bin/docker" <<'SH'
          #!/usr/bin/env sh
          if podman --remote --url "$PODMAN_HOST" info >/dev/null 2>&1; then
            exec podman --remote --url "$PODMAN_HOST" "$@"
          else
            exec podman --remote --url tcp://10.0.2.2:8666 "$@"
          fi
          SH
          chmod +x "$HOME/bin/docker"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Environment (DEV/PROD)
        run: |
          set -euo pipefail
          echo "[INFO] Selected mode: ${MODE}"
          if [[ "${MODE}" == "dev" ]]; then
            echo "VAULT_ADDR=http://host.containers.internal:18200" >> "$GITHUB_ENV"
            echo "VAULT_TOKEN=root" >> "$GITHUB_ENV"
            echo "AUTHENTICATION=none" >> "$GITHUB_ENV"
            echo "SKIP_REGISTRY=1" >> "$GITHUB_ENV"
            echo "DPT_REGISTRY_URL=" >> "$GITHUB_ENV"
            echo "API_VERSION=" >> "$GITHUB_ENV"
          else
            echo "VAULT_ADDR=${{ secrets.VAULT_PROD_ADDR }}" >> "$GITHUB_ENV"
            echo "VAULT_TOKEN=${{ secrets.VAULT_PROD_TOKEN }}" >> "$GITHUB_ENV"
            echo "AUTHENTICATION=app" >> "$GITHUB_ENV"
            echo "SKIP_REGISTRY=0" >> "$GITHUB_ENV"
            echo "DPT_REGISTRY_URL=${{ secrets.DPT_REGISTRY_URL }}" >> "$GITHUB_ENV"
            echo "API_VERSION=${{ vars.DPT_API_VERSION }}" >> "$GITHUB_ENV"
          fi

      - name: Install yq and jq
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          curl -sSL https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64 -o "$HOME/bin/yq"
          chmod +x "$HOME/bin/yq"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          if ! command -v jq >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then
              sudo apt-get update -y && sudo apt-get install -y jq
            else
              echo "[WARN] jq ausente; garante jq no runner." >&2
            fi
          fi
          yq --version || true
          jq --version || true

      - name: Load Test Configuration
        run: |
          set -euo pipefail
          CFG="${{ inputs.CONFIG_PATH }}"
          test -f "$CFG" || { echo "Config não encontrada: $CFG"; exit 1; }

          LAC_ID=$(yq -r '.lac_id' "$CFG")
          TEST_ID=$(yq -r '.test_id' "$CFG")
          BASE_URL=$(yq -r '.target.base_url' "$CFG")
          DURATION_S=$(yq -r '.load.duration_s' "$CFG")
          RPS=$(yq -r '.load.rps' "$CFG")
          CONCURRENCY=$(yq -r '.load.concurrency' "$CFG")
          LABEL_ENV=$(yq -r '.labels.environment' "$CFG")
          LABEL_SYS=$(yq -r '.labels.system' "$CFG")
          LABEL_NOTES=$(yq -r '.labels.notes' "$CFG")

          {
            echo "LAC_ID=$LAC_ID"
            echo "TEST_ID=$TEST_ID"
            echo "BASE_URL=$BASE_URL"
            echo "DURATION_S=$DURATION_S"
            echo "RPS=$RPS"
            echo "CONCURRENCY=$CONCURRENCY"
            echo "LABEL_ENV=$LABEL_ENV"
            echo "LABEL_SYS=$LABEL_SYS"
            echo "LABEL_NOTES=$LABEL_NOTES"
          } >> "$GITHUB_ENV"

          echo "[cfg] Carregado ${LAC_ID}/${TEST_ID} @ ${BASE_URL}"

      - name: Sanity Check (remote podman & paths)
        run: |
          set -euo pipefail
          podman --remote --url "$PODMAN_HOST" info || true
          docker --version || true
          echo "GITHUB_WORKSPACE=${GITHUB_WORKSPACE}"
          ls -la "${GITHUB_WORKSPACE}/shell" || true
          echo "MODE=${MODE}"

      - name: Seed Vault DEV (idempotent)
        if: ${{ env.MODE == 'dev' }}
        run: |
          set -euo pipefail
          VAULT_ENDPOINT="${VAULT_ADDR:-http://host.containers.internal:18200}"
          echo "[seed] Endpoint: $VAULT_ENDPOINT"
          curl -sS -H "X-Vault-Token: ${VAULT_TOKEN}" -H "Content-Type: application/json" \
               -X POST "$VAULT_ENDPOINT/v1/sys/mounts/devplatforms" \
               -d '{"type":"kv","options":{"version":"2"}}' >/dev/null 2>&1 || true
          curl -sS -H "X-Vault-Token: ${VAULT_TOKEN}" -H "Content-Type: application/json" \
               -X POST "$VAULT_ENDPOINT/v1/devplatforms/data/performance-platform/application" \
               -d '{"data":{"ptp_api_key":"dummy-ptp-key-123"}}' >/dev/null
          echo "[seed] OK"

      - name: Patch run-test.sh (prefer VAULT_ADDR; fallback VAULT_URL)
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mv shell/run-test.sh shell/run-test.orig.sh
          cat > shell/run-test.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          echo "[INFO] Starting test run..."
          GITHUB_TOKEN="${1}"; REPO="${2}"; LAC_ID="${3}"; TEST_ID="${4}"; TEST_HOME="${5}";
          USER_NAME="${6}"; GITHUB_REF_NAME="${7}"; VAULT_TOKEN="${8}";
          AUTHENTICATION="${9:-none}"; SCRIPT_VERSION="${10:-}"
          SHELL_DIR="${TEST_HOME}/shell"
          LIB_PATH="${SHELL_DIR}/run-test-lib.sh"
          if [[ ! -f "${LIB_PATH}" ]]; then echo "[ERROR] Failed to load libs"; exit 1; fi
          source "${LIB_PATH}"
          VAULT_ENDPOINT="${VAULT_ADDR:-${VAULT_URL:-}}"
          if [[ -z "${VAULT_ENDPOINT}" ]]; then echo "[ERROR] VAULT_ADDR/VAULT_URL não definido."; exit 1; fi
          echo "[INFO] Using Vault endpoint: ${VAULT_ENDPOINT}"
          echo "[INFO] Fetching PTP_API_KEY from Vault..."
          PTP_API_KEY=$(curl -sS --header "X-Vault-Token: ${VAULT_TOKEN}" \
            --request GET "${VAULT_ENDPOINT}/v1/devplatforms/data/performance-platform/application" \
            | jq -r '.data.data.ptp_api_key // empty')
          if [[ -z "${PTP_API_KEY}" ]]; then echo "[ERROR] Failed to retrieve API_KEY from Vault."; exit 1; fi
          export PTP_API_KEY
          if [[ "${AUTHENTICATION}" = "none" ]]; then
            echo "[INFO] Skipping GitHub App authentication in DEV."
          fi
          curl -sS --request POST -H "X-Vault-Token: ${VAULT_TOKEN}" \
            "${VAULT_ENDPOINT}/v1/auth/token/renew-self" >/dev/null || true
          echo "[INFO] Vault token renew attempted."
          echo "[INFO] Fetching test-definition.json..."
          curl -sS -H "Authorization: token ${GITHUB_TOKEN}" -H "Accept: application/vnd.github.v3.raw" \
               -o test-definition.json \
               "https://api.github.com/repos/${REPO}/contents/${TEST_HOME}/${LAC_ID}/${TEST_ID}/test-definition.json?ref=${GITHUB_REF_NAME}"
          if [[ ! -s test-definition.json ]] ; then echo "[ERROR] test-definition.json not found"; exit 1; fi
          for TYPE in $(jq -r '.test | keys[]' test-definition.json); do
            case "${TYPE}" in
              performance)
                bash "${SHELL_DIR}/cleanup-remote-job.sh" "${LAC_ID}" "${TEST_ID}" "${VAULT_TOKEN}" || true
                bash "${SHELL_DIR}/run-test-performance.sh" \
                  "${GITHUB_TOKEN}" "${REPO}" "${LAC_ID}" "${TEST_ID}" "${TEST_HOME}" \
                  "${USER_NAME}" "${GITHUB_REF_NAME}" "${VAULT_TOKEN}" "" "${PTP_API_KEY}" \
                  "${AUTHENTICATION}" "${SCRIPT_VERSION}" || handle_error "[ERROR] Test run failed!"
                ;;
              resilience)
                bash "${SHELL_DIR}/run-test-resilience.sh" \
                  "${GITHUB_TOKEN}" "${REPO}" "${LAC_ID}" "${TEST_ID}" "${TEST_HOME}" \
                  "${USER_NAME}" "${GITHUB_REF_NAME}" "${VAULT_TOKEN}" "" "${PTP_API_KEY}" \
                  || handle_error "[ERROR] Test run failed!"
                ;;
              *)
                echo "[ERROR] Unsupported test type: ${TYPE}"; exit 1;;
            esac
          done
          echo "[INFO] Test run completed."
          SH
          chmod +x shell/run-test.sh

      - name: Make scripts executable
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          chmod +x shell/run-test.sh || true
          chmod +x shell/run-test-performance-jmeter.sh || true
          chmod +x shell/cleanup-remote-job.sh || true
          chmod +x shell/report-summary.sh || true

      - name: Diag — Health do Vault
        run: |
          set -euo pipefail
          VAULT_ENDPOINT="${VAULT_ADDR:-${VAULT_URL:-}}"
          echo "[diag] VAULT_ENDPOINT=$VAULT_ENDPOINT"
          curl -sS "$VAULT_ENDPOINT/v1/sys/health" || (echo "[diag] Falha a aceder ao Vault" && exit 1)

      - name: Running test
        env:
          PERFORMANCE_HOME: ${{ github.workspace }}
          AUTHENTICATION: ${{ env.AUTHENTICATION }}
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          echo "Running performance test ${TEST_ID} on LAC ${LAC_ID}"
          export BASE_URL DURATION_S RPS CONCURRENCY LABEL_ENV LABEL_SYS LABEL_NOTES
          bash shell/run-test.sh \
            "${{ github.token }}" \
            "${{ github.repository }}" \
            "${LAC_ID}" \
            "${TEST_ID}" \
            "${PERFORMANCE_HOME}" \
            "${{ github.actor }}" \
            "${{ github.ref_name }}" \
            "${VAULT_TOKEN}" \
            "${AUTHENTICATION}"

      - name: Build results summary
        run: |
          set -euo pipefail
          bash shell/report-summary.sh "${LAC_ID}" "${TEST_ID}" "results"
          test -s results/summary.json

      - name: Upload results artifacts
        uses: actions/upload-artifact@v4
        with:
          name: perf-results-${{ env.LAC_ID }}-${{ env.TEST_ID }}-${{ github.run_id }}
          path: |
            results/summary.json
            results/raw/**
          if-no-files-found: warn

      - name: Write run summary
        run: |
          set -euo pipefail
          THR=$(jq -r '.metrics.throughput_rps' results/summary.json)   # RPS (Requests Per Second — pedidos por segundo)
          P95=$(jq -r '.metrics.p95_latency_ms' results/summary.json)   # P95 (Percentil 95) de latência em ms
          ERR=$(jq -r '.metrics.error_rate_pct' results/summary.json)   # Taxa de erro (%)
          DUR=$(jq -r '.metrics.duration_s' results/summary.json)       # Duração (s)
          REQ=$(jq -r '.metrics.requests_total' results/summary.json)   # Total de pedidos
          {
            echo "## Resultados — ${LAC_ID} / ${TEST_ID}"
            echo
            echo "| Métrica | Valor |"
            echo "|---|---:|"
            echo "| Throughput (RPS) | $THR |"
            echo "| P95 Latência (ms) | $P95 |"
            echo "| Taxa de Erro (%) | $ERR |"
            echo "| Duração (s) | $DUR |"
            echo "| Pedidos totais | $REQ |"
          } >> "$GITHUB_STEP_SUMMARY"

      # 4.4) Publicar no JIRA (fix de headers em arrays + AUTO↔H1 + v3→v2)
      - name: Publish to JIRA
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
        run: |
          set -euo pipefail
          test -s results/summary.json
          command -v jq >/dev/null || { echo "jq em falta"; exit 1; }

          CURL_BIN="curl"
          AUTO_FLAGS=( -sS --retry 3 --retry-delay 2 )
          H1_FLAGS=( -sS --http1.1 --retry 3 --retry-delay 2 )
          "$CURL_BIN" --help 2>/dev/null | grep -q -- '--retry-all-errors' && AUTO_FLAGS+=( --retry-all-errors ) && H1_FLAGS+=( --retry-all-errors )
          "$CURL_BIN" --help 2>/dev/null | grep -q -- '--retry-connrefused' && AUTO_FLAGS+=( --retry-connrefused ) && H1_FLAGS+=( --retry-connrefused )

          CURL_AUTO() { "$CURL_BIN" "${AUTO_FLAGS[@]}" "$@"; }
          CURL_H1()   { "$CURL_BIN" "${H1_FLAGS[@]}" "$@"; }

          AUTH_B64="$(printf '%s:%s' "$JIRA_EMAIL" "$JIRA_API_TOKEN" | base64)"

          # Headers como arrays: cada -H "chave: valor" é um argumento único
          HDR_JSON=( -H "Authorization: Basic $AUTH_B64" -H "Accept: application/json" -H "Content-Type: application/json" )
          HDR_JSON_NOCT=( -H "Authorization: Basic $AUTH_B64" -H "Accept: application/json" )

          THR=$(jq -r '.metrics.throughput_rps' results/summary.json)   # RPS (Requests Per Second — pedidos por segundo)
          P95=$(jq -r '.metrics.p95_latency_ms' results/summary.json)   # P95 (Percentil 95) de latência em ms
          ERR=$(jq -r '.metrics.error_rate_pct' results/summary.json)   # Taxa de erro (%)
          DUR=$(jq -r '.metrics.duration_s' results/summary.json)       # Duração (s)
          REQ=$(jq -r '.metrics.requests_total' results/summary.json)   # Total de pedidos
          TS=$(jq -r '.timestamp_utc' results/summary.json)             # UTC (Coordinated Universal Time — Tempo Universal Coordenado)

          SUMMARY="Perf: ${LAC_ID}/${TEST_ID} @ ${LABEL_ENV:-dev} (run ${{ github.run_id }})"

          read -r -d '' DESC <<MD || true
          Performance Test
          - LAC: ${LAC_ID}
          - TEST: ${TEST_ID}
          - Environment: ${LABEL_ENV:-}
          - System: ${LABEL_SYS:-}
          - Notes: ${LABEL_NOTES:-}
          - Timestamp (UTC): ${TS}
          - Base URL: ${BASE_URL:-}

          Metrics
          | Métrica | Valor |
          |---|---:|
          | Throughput (RPS) | ${THR} |
          | P95 Latência (ms) | ${P95} |
          | Taxa de Erro (%) | ${ERR} |
          | Duração (s) | ${DUR} |
          | Pedidos totais | ${REQ} |
          MD

          # createmeta v3 → v2 (AUTO; se 4xx/5xx e não for codec_error, tenta H1)
          META_V3="$JIRA_BASE_URL/rest/api/3/issue/createmeta?projectKeys=$JIRA_PROJECT_KEY"
          META_V2="$JIRA_BASE_URL/rest/api/2/issue/createmeta?projectKeys=$JIRA_PROJECT_KEY"

          CODE=$(CURL_AUTO -X GET "$META_V3" "${HDR_JSON[@]}" -w '%{http_code}' -o /tmp/jira_meta.json || true)
          if [[ ! "$CODE" =~ ^2 ]] || ! jq -e . >/dev/null 2>&1 < /tmp/jira_meta.json; then
            if ! grep -qi 'http1\.codec_error' /tmp/jira_meta.json 2>/dev/null; then
              CODE=$(CURL_H1 -X GET "$META_V3" "${HDR_JSON[@]}" -w '%{http_code}' -o /tmp/jira_meta.json || true)
            fi
          fi
          if [[ ! "$CODE" =~ ^2 ]] || ! jq -e . >/dev/null 2>&1 < /tmp/jira_meta.json; then
            CODE=$(CURL_AUTO -X GET "$META_V2" "${HDR_JSON[@]}" -w '%{http_code}' -o /tmp/jira_meta.json || true)
            if [[ ! "$CODE" =~ ^2 ]] || ! jq -e . >/dev/null 2>&1 < /tmp/jira_meta.json; then
              if ! grep -qi 'http1\.codec_error' /tmp/jira_meta.json 2>/dev/null; then
                CODE=$(CURL_H1 -X GET "$META_V2" "${HDR_JSON[@]}" -w '%{http_code}' -o /tmp/jira_meta.json || true)
              fi
            end
          fi
          if ! jq -e . >/dev/null 2>&1 < /tmp/jira_meta.json; then
            echo "[JIRA] Falha ao obter createmeta (HTTP $CODE). Corpo:"
            cat /tmp/jira_meta.json || true
            exit 1
          fi

          ISSUE_TYPE_ID=$(jq -r '.projects[0].issuetypes | (map(select(.name=="Task"))[0].id // .[0].id // empty)' /tmp/jira_meta.json)
          if [[ -z "${ISSUE_TYPE_ID:-}" ]]; then
            echo "[JIRA] Não foi possível determinar um Issue Type válido. Disponíveis:"
            jq -r '.projects[0].issuetypes[].name' /tmp/jira_meta.json || true
            exit 1
          fi

          PAYLOAD=$(jq -n --arg p "$JIRA_PROJECT_KEY" --arg s "$SUMMARY" --arg d "$DESC" --arg it "$ISSUE_TYPE_ID" \
            '{fields:{project:{key:$p},summary:$s,description:$d,issuetype:{id:$it}}}')
          echo "$PAYLOAD" > /tmp/jira_create_payload.json

          ISSUE_KEY=""
          for URL in "$JIRA_BASE_URL/rest/api/3/issue" "$JIRA_BASE_URL/rest/api/2/issue"; do
            CODE=$(CURL_AUTO -X POST "$URL" "${HDR_JSON[@]}" -d @/tmp/jira_create_payload.json -w '%{http_code}' -o /tmp/jira_create.json || true)
            if [[ ! "$CODE" =~ ^2 ]] && ! grep -qi 'http1\.codec_error' /tmp/jira_create.json 2>/dev/null; then
              CODE=$(CURL_H1 -X POST "$URL" "${HDR_JSON[@]}" -d @/tmp/jira_create_payload.json -w '%{http_code}' -o /tmp/jira_create.json || true)
            fi
            if [[ "$CODE" =~ ^2 ]]; then
              ISSUE_KEY=$(jq -r '.key // empty' /tmp/jira_create.json)
              [[ -n "$ISSUE_KEY" && "$ISSUE_KEY" != "null" ]] && break
            fi
          done

          if [[ -z "$ISSUE_KEY" ]]; then
            echo "[JIRA] Criação falhou (HTTP $CODE). Corpo de resposta:"
            cat /tmp/jira_create.json || true
            echo "[JIRA] Payload:"
            cat /tmp/jira_create_payload.json
            exit 1
          fi
          echo "[JIRA] Issue criada: $ISSUE_KEY"

          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          COMMENT=$(jq -n --arg c "**Run:** $RUN_URL" '{body:$c}')
          echo "$COMMENT" > /tmp/jira_comment.json

          # Comentário
          CODE=$(CURL_AUTO -X POST "$JIRA_BASE_URL/rest/api/2/issue/$ISSUE_KEY/comment" "${HDR_JSON[@]}" -d @/tmp/jira_comment.json -w '%{http_code}' -o /tmp/jira_comment.out || true)
          if [[ ! "$CODE" =~ ^2 ]] && ! grep -qi 'http1\.codec_error' /tmp/jira_comment.out 2>/dev/null; then
            CODE=$(CURL_H1 -X POST "$JIRA_BASE_URL/rest/api/2/issue/$ISSUE_KEY/comment" "${HDR_JSON[@]}" -d @/tmp/jira_comment.json -w '%{http_code}' -o /tmp/jira_comment.out || true)
          fi
          if [[ ! "$CODE" =~ ^2 ]]; then
            echo "[JIRA] Comentário falhou (HTTP $CODE):"
            cat /tmp/jira_comment.out || true
            exit 1
          fi

          # Anexo (multipart)
          CODE=$(CURL_AUTO -X POST "$JIRA_BASE_URL/rest/api/2/issue/$ISSUE_KEY/attachments" \
            "${HDR_JSON_NOCT[@]}" -H "X-Atlassian-Token: no-check" -F "file=@results/summary.json" \
            -w '%{http_code}' -o /tmp/jira_attach.out || true)
          if [[ ! "$CODE" =~ ^2 ]] && ! grep -qi 'http1\.codec_error' /tmp/jira_attach.out 2>/dev/null; then
            CODE=$(CURL_H1 -X POST "$JIRA_BASE_URL/rest/api/2/issue/$ISSUE_KEY/attachments" \
              "${HDR_JSON_NOCT[@]}" -H "X-Atlassian-Token: no-check" -F "file=@results/summary.json" \
              -w '%{http_code}' -o /tmp/jira_attach.out || true)
          fi
          if [[ ! "$CODE" =~ ^2 ]]; then
            echo "[JIRA] Anexo falhou (HTTP $CODE):"
            cat /tmp/jira_attach.out || true
            exit 1
          fi

          echo "[JIRA] Comentário e anexo enviados."

      - name: Cleanup remote job
        if: always()
        env:
          PERFORMANCE_HOME: ${{ github.workspace }}
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          bash shell/cleanup-remote-job.sh "${LAC_ID}" "${TEST_ID}" "${VAULT_TOKEN}"
