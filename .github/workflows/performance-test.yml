name: Performance Test
description: Run performance tests from a config file and publish results.

on:
  workflow_dispatch:
    inputs:
      ENVIRONMENT:
        description: "Execution mode (dev|prod)"
        required: true
        default: "dev"
      CONFIG_PATH:
        description: "Caminho do YAML do teste (ex.: configs/TEST.0001.yml)"
        required: true
        default: "configs/TEST.0001.yml"

jobs:
  performance-test:
    name: Performance Testing Pipeline
    runs-on: self-hosted  # ou [self-hosted, linux, podman, perf]
    timeout-minutes: 600

    env:
      MODE: ${{ inputs.ENVIRONMENT }}
      AUTHENTICATION: none

    steps:
      # 0) Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1) Configurar ambiente de execução
      - name: Setup Environment (DEV/PROD)
        run: |
          echo "[INFO] Selected mode: ${MODE}"
          if [[ "${MODE}" == "dev" ]]; then
            echo "VAULT_ADDR=http://host.containers.internal:18200" >> "$GITHUB_ENV"
            echo "VAULT_TOKEN=root" >> "$GITHUB_ENV"
            echo "AUTHENTICATION=none" >> "$GITHUB_ENV"
          else
            echo "VAULT_ADDR=${{ secrets.VAULT_PROD_ADDR }}" >> "$GITHUB_ENV"
            echo "VAULT_TOKEN=${{ secrets.VAULT_PROD_TOKEN }}" >> "$GITHUB_ENV"
            echo "AUTHENTICATION=app" >> "$GITHUB_ENV"
          fi

      # 2) Instalar ferramentas auxiliares
      - name: Install YAML parser (yq)
        run: |
          curl -sSL https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64 -o /usr/local/bin/yq
          chmod +x /usr/local/bin/yq
          yq --version

      # 3) Carregar configuração YAML
      - name: Load Test Configuration
        run: |
          set -euo pipefail
          CFG="${{ inputs.CONFIG_PATH }}"
          test -f "$CFG" || { echo "Config não encontrada: $CFG"; exit 1; }

          for field in lac_id test_id target.base_url load.duration_s load.rps load.concurrency labels.environment labels.system labels.notes; do
            key=$(echo "$field" | tr '.' '_')
            val=$(yq -r ".$field" "$CFG")
            echo "${key^^}=$val" >> "$GITHUB_ENV"
          done

          echo "[cfg] Config carregada: ${LAC_ID}/${TEST_ID} @ ${TARGET_BASE_URL}"

      # 4) Sanity check
      - name: Sanity Check
        run: |
          echo "[sanity] Workspace: ${GITHUB_WORKSPACE}"
          echo "[sanity] Mode: ${MODE}"
          ls -la "${GITHUB_WORKSPACE}/shell" || true

      # 5) Seed Vault (DEV)
      - name: Seed Vault (DEV)
        if: ${{ env.MODE == 'dev' }}
        run: |
          VAULT_ENDPOINT="${VAULT_ADDR}"
          echo "[seed] Endpoint: $VAULT_ENDPOINT"
          curl -sS -H "X-Vault-Token: ${VAULT_TOKEN}" -H "Content-Type: application/json" \
               -X POST "$VAULT_ENDPOINT/v1/sys/mounts/devplatforms" \
               -d '{"type":"kv","options":{"version":"2"}}' >/dev/null 2>&1 || true
          curl -sS -H "X-Vault-Token: ${VAULT_TOKEN}" -H "Content-Type: application/json" \
               -X POST "$VAULT_ENDPOINT/v1/devplatforms/data/performance-platform/application" \
               -d '{"data":{"ptp_api_key":"dummy-ptp-key-123"}}' >/dev/null
          echo "[seed] Vault DEV ready"

      # 6) Executar o teste
      - name: Run Performance Test
        working-directory: ${{ github.workspace }}
        run: |
          echo "[run] Running performance test: ${LAC_ID}/${TEST_ID}"
          bash shell/run-test.sh \
            "${{ secrets.GITHUB_TOKEN }}" \
            "${{ github.repository }}" \
            "${LAC_ID}" \
            "${TEST_ID}" \
            "${GITHUB_WORKSPACE}" \
            "${{ github.actor }}" \
            "${{ github.ref_name }}" \
            "${VAULT_TOKEN}" \
            "${AUTHENTICATION}"

      # 7) Gerar resumo dos resultados
      - name: Build Results Summary
        run: |
          bash shell/report-summary.sh "${LAC_ID}" "${TEST_ID}" "results"
          test -s results/summary.json

      # 8) Publicar artefactos
      - name: Upload Results Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: perf-results-${{ env.LAC_ID }}-${{ env.TEST_ID }}-${{ github.run_id }}
          path: |
            results/summary.json
            results/raw/**
          if-no-files-found: warn

      # 9) Gerar resumo no GitHub
      - name: Write Run Summary
        run: |
          THR=$(jq -r '.metrics.throughput_rps' results/summary.json)
          P95=$(jq -r '.metrics.p95_latency_ms' results/summary.json)
          ERR=$(jq -r '.metrics.error_rate_pct' results/summary.json)
          DUR=$(jq -r '.metrics.duration_s' results/summary.json)
          REQ=$(jq -r '.metrics.requests_total' results/summary.json)
          echo "## Resultados — ${LAC_ID} / ${TEST_ID}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Métrica | Valor |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---:|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Throughput (RPS) | $THR |" >> "$GITHUB_STEP_SUMMARY"
          echo "| P95 Latência (ms) | $P95 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Taxa de Erro (%) | $ERR |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Duração (s) | $DUR |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Pedidos totais | $REQ |" >> "$GITHUB_STEP_SUMMARY"

      # 10) Publicar no JIRA
      - name: Publish Results to JIRA
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
        run: |
          set -euo pipefail
          test -s results/summary.json

          AUTH="$(printf '%s:%s' "$JIRA_EMAIL" "$JIRA_API_TOKEN" | base64)"
          THR=$(jq -r '.metrics.throughput_rps' results/summary.json)
          P95=$(jq -r '.metrics.p95_latency_ms' results/summary.json)
          ERR=$(jq -r '.metrics.error_rate_pct' results/summary.json)
          DUR=$(jq -r '.metrics.duration_s' results/summary.json)
          REQ=$(jq -r '.metrics.requests_total' results/summary.json)
          TS=$(jq -r '.timestamp_utc' results/summary.json)

          SUMMARY="Perf: ${LAC_ID}/${TEST_ID} @ ${LABEL_ENV:-dev} (run ${{ github.run_id }})"

          DESC=$(cat <<MD
          **Performance Test**
          - LAC: ${LAC_ID}
          - TEST: ${TEST_ID}
          - Environment: ${LABEL_ENV:-}
          - System: ${LABEL_SYS:-}
          - Notes: ${LABEL_NOTES:-}
          - Timestamp (UTC): ${TS}
          - Base URL: ${BASE_URL:-}

          **Metrics**
          | Métrica | Valor |
          |---|---:|
          | Throughput (RPS) | ${THR} |
          | P95 Latência (ms) | ${P95} |
          | Taxa de Erro (%) | ${ERR} |
          | Duração (s) | ${DUR} |
          | Pedidos totais | ${REQ} |
          MD
          )

          PAYLOAD=$(jq -n --arg p "$JIRA_PROJECT_KEY" --arg s "$SUMMARY" --arg d "$DESC" '{
            fields: {
              project: { key: $p },
              summary: $s,
              description: $d,
              issuetype: { name: "Task" }
            }
          }')

          CREATE_RES=$(curl -sS -X POST "$JIRA_BASE_URL/rest/api/2/issue" \
            -H "Authorization: Basic $AUTH" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          ISSUE_KEY=$(echo "$CREATE_RES" | jq -r '.key // empty')
          if [[ -z "$ISSUE_KEY" ]]; then
            echo "[JIRA] Falhou: $CREATE_RES"
            exit 1
          fi
          echo "[JIRA] Issue criada: $ISSUE_KEY"

          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          COMMENT="{\"body\": \"**Run:** $RUN_URL\"}"
          curl -sS -X POST "$JIRA_BASE_URL/rest/api/2/issue/$ISSUE_KEY/comment" \
            -H "Authorization: Basic $AUTH" \
            -H "Content-Type: application/json" \
            -d "$COMMENT" >/dev/null

          curl -sS -X POST "$JIRA_BASE_URL/rest/api/2/issue/$ISSUE_KEY/attachments" \
            -H "Authorization: Basic $AUTH" \
            -H "X-Atlassian-Token: no-check" \
            -F "file=@results/summary.json" >/dev/null

          echo "[JIRA] Comentário e anexo enviados."

      # 11) Cleanup (executa sempre)
      - name: Cleanup Remote Job
        if: always()
        run: |
          bash shell/cleanup-remote-job.sh "${LAC_ID}" "${TEST_ID}" "${VAULT_TOKEN}"
